{% extends "jobs/_shell.html" %}
{% block title %}Inscription | JobSearch{% endblock %}
{% block content %}
<section class="max-w-md mx-auto">
  <div class="mb-8">
    <p class="text-sm text-primary font-bold uppercase tracking-wide">
      Rejoindre JobSearch
    </p>
    <h1 class="text-3xl font-black mt-2">Créer un compte</h1>
  </div>
  <form
    method="post"
    class="bg-base-100 rounded-2xl border border-base-300 shadow-sm p-6 space-y-4"
  >
    {% csrf_token %}<label class="form-control"
      ><span class="label-text font-bold">Nom d'utilisateur</span
      ><input
        name="username"
        required
        class="input input-bordered w-full" /></label
    ><label class="form-control"
      ><span class="label-text font-bold">E-mail</span
      ><input
        name="email"
        type="email"
        required
        class="input input-bordered w-full" /></label
    ><label class="form-control"
      ><span class="label-text font-bold">Mot de passe</span
      ><input
        name="password"
        type="password"
        minlength="8"
        required
        class="input input-bordered w-full" /></label
    ><button class="btn btn-primary w-full">S'inscrire</button>
    <p class="text-center text-sm">
      Déjà inscrit ?
      <a class="link link-primary" href="{% url 'connexion' %}">Se connecter</a>
    </p>
  </form>
</section>
{% endblock %}
